name: Archive RULES.md

on:
  push:
    paths:
      - 'RULES.md'

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Archive previous version
        run: |
          mkdir -p archive/rules
          
          # Проверяем, изменился ли файл
          if git diff --quiet HEAD~1 HEAD -- RULES.md; then
            echo "RULES.md не изменился"
            exit 0
          fi
          
          # Получаем дату ПОСЛЕДНЕГО ИЗМЕНЕНИЯ файла RULES.md (создание текущей версии)
          export TZ='Europe/Moscow'
          TIMESTAMP=$(git log -1 --format=%cd --date=format:'%Y.%m.%d_%H-%M-%S' HEAD~1 -- RULES.md)
          
          # Если это первый коммит файла (нет истории)
          if [ -z "$TIMESTAMP" ]; then
            TIMESTAMP=$(date +"%Y.%m.%d_%H-%M-%S")
          fi
          
          # Сохраняем предыдущую версию с датой её создания
          git show HEAD~1:RULES.md > "archive/rules/RULES_${TIMESTAMP}.md"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/rules/
          git commit -m "Archive RULES.md ${TIMESTAMP}"
          git push